<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Návrat z platby — mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Jost:wght@300;400;500&amp;display=swap">
<style>
body{margin:0;background:#120A12}
a{color:#F1D0BC}a:hover{color:#FFE6D6}
a:focus-visible{outline:2px solid #EDB894;outline-offset:3px}
.mv-glow{animation:mvGlow 3.4s ease-in-out infinite}
@keyframes mvGlow{0%,100%{opacity:.35}50%{opacity:.9}}
@media (prefers-reduced-motion: reduce){.mv-glow{animation:none;opacity:.7}}
h1,h2,h3{text-wrap:balance}p,li,dd,figcaption{text-wrap:pretty}
@supports (animation-timeline: view()){.mv-reveal{animation:mvReveal linear both;animation-timeline:view();animation-range:entry 0% cover 28%}}
@keyframes mvReveal{from{opacity:0;translate:0 28px}}
@media (prefers-reduced-motion: reduce){.mv-reveal{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 375px; min-height: 812px; box-sizing: border-box; background: #120A12; color: #F4E9E4; font-family: 'Jost', system-ui, sans-serif; font-weight: 400; overflow: hidden">
<svg aria-hidden="true" viewBox="0 0 375 812" style="position: absolute; inset: 0; width: 375px; height: 812px; pointer-events: none"><defs><filter id="m7Pool" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="50"></feGaussianBlur></filter></defs><ellipse cx="188" cy="330" rx="200" ry="180" fill="#3A1838" opacity="0.5" filter="url(#m7Pool)"></ellipse></svg>
<header style="position: relative; display: flex; justify-content: center; padding: 22px 16px">
<span style="font-family: 'EB Garamond', serif; font-size: 17px; letter-spacing: 0.14em; color: #EADCE2">MEZI VÁMI</span>
</header>
<main style="position: relative; padding: 90px 24px 0; text-align: center">
<sc-if value="{{ waiting }}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="140" height="94" viewBox="0 0 180 120" style="display: block; margin: 0 auto 10px"><defs><filter id="m7Blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"></feGaussianBlur></filter><clipPath id="m7Clip"><circle cx="70" cy="60" r="44"></circle></clipPath></defs><circle cx="70" cy="60" r="44" fill="none" stroke="#C9A0B8" stroke-width="1"></circle><circle cx="110" cy="60" r="44" fill="none" stroke="#F2C6A6" stroke-width="1"></circle><g clip-path="url(#m7Clip)"><circle class="mv-glow" cx="110" cy="60" r="44" fill="#EDB894" filter="url(#m7Blur)"></circle></g></svg>
</sc-if>
<h1 role="status" style="margin: 14px 0 0; font-family: 'EB Garamond', serif; font-weight: 400; font-size: 36px; line-height: 1.08; color: #F1D0BC">{{ headline }}</h1>
<p style="margin: 14px 0 0; font-size: 16px; line-height: 1.6; color: #E8DAE0">{{ body }}</p>
<sc-if value="{{ hasHelper }}" hint-placeholder-val="{{ true }}">
<p style="margin: 12px 0 0; font-size: 14px; line-height: 1.6; color: #BDA7B2">{{ helper }}</p>
</sc-if>
<a href="{{ ctaHref }}" style="margin-top: 32px; display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 999px; background: linear-gradient(180deg, #F7D5BB 0%, #E8B391 100%); color: #2A1220; text-decoration: none; box-shadow: 0 12px 36px rgba(240, 160, 130, 0.4), inset 0 1px 0 rgba(255, 244, 236, 0.7); font-size: 16px; font-weight: 500">{{ cta }}</a>
<sc-if value="{{ showSupport }}" hint-placeholder-val="{{ true }}">
<a href="#" style="margin-top: 8px; display: flex; align-items: center; justify-content: center; min-height: 48px; font-size: 15px">Kontaktovat podporu</a>
</sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stav":{"editor":"enum","options":["Čeká na potvrzení","Nepodařilo se ověřit","Zrušeno","Neúspěšná platba"],"default":"Čeká na potvrzení"},"podpora":{"editor":"boolean","default":true},"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
renderVals() {
const st = this.props.stav ?? 'Čeká na potvrzení';
const sup = !!(this.props.podpora ?? true);
const S = {
'Čeká na potvrzení': { h: 'Čekáme na potvrzení platby', b: 'Platební partner nám platbu zatím nepotvrdil. Objednávka vznikne až po tomto potvrzení.', hp: 'Platbu prosím nezadávejte znovu. Po potvrzení platby vám pošleme potvrzovací e-mail.', c: 'Zkontrolovat stav platby', href: 'Mobil-08-Objednavka.dc.html', s: true, w: true },
'Nepodařilo se ověřit': { h: 'Stav platby zatím neznáme', b: 'Platbu se nám zatím nepodařilo ověřit. Objednávku proto zatím nepovažujeme za přijatou.', hp: 'Než stav ověříme, platbu prosím nezadávejte znovu. Pokud vám byla částka stržena, kontaktujte podporu.', c: 'Zkontrolovat stav platby', href: 'Mobil-08-Objednavka.dc.html', s: true, w: false },
'Zrušeno': { h: 'Platba nebyla dokončena', b: 'Platba byla zrušena a objednávka nevznikla.', hp: '', c: 'Zpět k objednávce', href: 'Mobil-06-Pokladna.dc.html', s: false, w: false },
'Neúspěšná platba': { h: 'Platbu se nepodařilo dokončit', b: 'Platbu můžete zkusit znovu.', hp: 'Opakovaný pokus nevytvoří druhou objednávku.', c: 'Zkusit platbu znovu', href: 'Mobil-06-Pokladna.dc.html', s: false, w: false }
};
const x = S[st] || S['Čeká na potvrzení'];
return { headline: x.h, body: x.b, helper: x.hp, hasHelper: !!x.hp, cta: x.c, ctaHref: x.href, showSupport: x.s && sup, waiting: x.w };
}
}
</script>
</body>
</html>
