<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Návrat z platby (desktop)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Jost:wght@300;400;500&amp;display=swap">
<style>
body{margin:0;background:#120A12}
a{color:#F1D0BC}a:hover{color:#FFE6D6}
a:focus-visible,button:focus-visible{outline:2px solid #EDB894;outline-offset:3px}
.mv-glow{animation:mvGlow 3.4s ease-in-out infinite}
@keyframes mvGlow{0%,100%{opacity:.35}50%{opacity:.9}}
@media (prefers-reduced-motion: reduce){.mv-glow{animation:none;opacity:.7}}
h1,h2,h3{text-wrap:balance}p,li,dd,figcaption{text-wrap:pretty}
@supports (animation-timeline: view()){.mv-reveal{animation:mvReveal linear both;animation-timeline:view();animation-range:entry 0% cover 28%}}
@keyframes mvReveal{from{opacity:0;translate:0 28px}}
@media (prefers-reduced-motion: reduce){.mv-reveal{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 100%; min-height: 900px; background: #120A12; color: #F4E9E4; font-family: 'Jost', system-ui, sans-serif; font-weight: 400; overflow: hidden; display: flex; flex-direction: column">
<svg aria-hidden="true" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none"><defs><filter id="d7Pool" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="90"></feGaussianBlur></filter></defs><ellipse cx="720" cy="420" rx="460" ry="300" fill="#3A1838" opacity="0.5" filter="url(#d7Pool)"></ellipse></svg>
<header style="position: relative; max-width: 1280px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 28px 40px">
<span style="font-family: 'EB Garamond', serif; font-size: 23px; letter-spacing: 0.14em; color: #EADCE2">MEZI VÁMI</span>
</header>
<main style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 40px 120px">
<div style="width: 100%; max-width: 620px; padding: 52px 56px; border-radius: 28px; border: 1px solid transparent; background: linear-gradient(170deg, rgba(46, 24, 48, 0.92), rgba(22, 11, 24, 0.96)) padding-box, linear-gradient(140deg, rgba(255, 214, 190, 0.45), rgba(185, 138, 198, 0.12) 55%, rgba(255, 214, 190, 0.3)) border-box; box-shadow: 0 40px 90px rgba(0, 0, 0, 0.55); text-align: center">
<sc-if value="{{ waiting }}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="120" height="80" viewBox="0 0 180 120" style="display: block; margin: 0 auto 8px"><defs><filter id="d7Blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"></feGaussianBlur></filter><clipPath id="d7Clip"><circle cx="70" cy="60" r="44"></circle></clipPath></defs><circle cx="70" cy="60" r="44" fill="none" stroke="#C9A0B8" stroke-width="1"></circle><circle cx="110" cy="60" r="44" fill="none" stroke="#F2C6A6" stroke-width="1"></circle><g clip-path="url(#d7Clip)"><circle class="mv-glow" cx="110" cy="60" r="44" fill="#EDB894" filter="url(#d7Blur)"></circle></g></svg>
</sc-if>
<h1 role="status" style="margin: 16px 0 0; font-family: 'EB Garamond', serif; font-weight: 400; font-size: 48px; line-height: 1.06; color: #F1D0BC">{{ headline }}</h1>
<p style="margin: 18px 0 0; font-size: 18px; line-height: 1.65; color: #E8DAE0">{{ body }}</p>
<sc-if value="{{ hasHelper }}" hint-placeholder-val="{{ true }}">
<p style="margin: 14px 0 0; font-size: 15px; line-height: 1.6; color: #BDA7B2">{{ helper }}</p>
</sc-if>
<div style="margin-top: 34px; display: flex; flex-direction: column; align-items: center; gap: 10px">
<a href="{{ ctaHref }}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 58px; padding: 0 40px; border-radius: 999px; background: linear-gradient(180deg, #F7D5BB 0%, #E8B391 100%); color: #2A1220; text-decoration: none; box-shadow: 0 12px 36px rgba(240, 160, 130, 0.4), 0 0 70px rgba(240, 160, 130, 0.22), inset 0 1px 0 rgba(255, 244, 236, 0.7); font-size: 16px; font-weight: 500">{{ cta }}</a>
<sc-if value="{{ showSupport }}" hint-placeholder-val="{{ true }}">
<a href="#" style="display: inline-flex; align-items: center; min-height: 48px; font-size: 15px">Kontaktovat podporu</a>
</sc-if>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stav":{"editor":"enum","options":["Čeká na potvrzení","Nepodařilo se ověřit","Zrušeno","Neúspěšná platba"],"default":"Čeká na potvrzení"},"podpora":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const st = this.props.stav ?? 'Čeká na potvrzení';
const sup = !!(this.props.podpora ?? true);
const S = {
'Čeká na potvrzení': { h: 'Čekáme na potvrzení platby', b: 'Platební partner nám platbu zatím nepotvrdil. Objednávka vznikne až po tomto potvrzení.', hp: 'Platbu prosím nezadávejte znovu. Po potvrzení platby vám pošleme potvrzovací e-mail.', c: 'Zkontrolovat stav platby', href: 'D-08-Objednavka.dc.html', s: true, w: true },
'Nepodařilo se ověřit': { h: 'Stav platby zatím neznáme', b: 'Platbu se nám zatím nepodařilo ověřit. Objednávku proto zatím nepovažujeme za přijatou.', hp: 'Než stav ověříme, platbu prosím nezadávejte znovu. Pokud vám byla částka stržena, kontaktujte podporu.', c: 'Zkontrolovat stav platby', href: 'D-08-Objednavka.dc.html', s: true, w: false },
'Zrušeno': { h: 'Platba nebyla dokončena', b: 'Platba byla zrušena a objednávka nevznikla.', hp: '', c: 'Zpět k objednávce', href: 'D-06-Pokladna.dc.html', s: false, w: false },
'Neúspěšná platba': { h: 'Platbu se nepodařilo dokončit', b: 'Platbu můžete zkusit znovu.', hp: 'Opakovaný pokus nevytvoří druhou objednávku.', c: 'Zkusit platbu znovu', href: 'D-06-Pokladna.dc.html', s: false, w: false }
};
const x = S[st] || S['Čeká na potvrzení'];
return { headline: x.h, body: x.b, helper: x.hp, hasHelper: !!x.hp, cta: x.c, ctaHref: x.href, showSupport: x.s && sup, waiting: x.w };
}
}
</script>
</body>
</html>
