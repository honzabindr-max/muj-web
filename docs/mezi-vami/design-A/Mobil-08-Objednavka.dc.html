<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Objednávka a doručení — mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Jost:wght@300;400;500&amp;display=swap">
<style>
body{margin:0;background:#120A12}
a{color:#F1D0BC}a:hover{color:#FFE6D6}
a:focus-visible{outline:2px solid #EDB894;outline-offset:3px}
h1,h2,h3{text-wrap:balance}p,li,dd,figcaption{text-wrap:pretty}
@supports (animation-timeline: view()){.mv-reveal{animation:mvReveal linear both;animation-timeline:view();animation-range:entry 0% cover 28%}}
@keyframes mvReveal{from{opacity:0;translate:0 28px}}
@media (prefers-reduced-motion: reduce){.mv-reveal{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 375px; min-height: 900px; box-sizing: border-box; background: #120A12; color: #F4E9E4; font-family: 'Jost', system-ui, sans-serif; font-variant-numeric: lining-nums; font-weight: 400; overflow: hidden">
<svg aria-hidden="true" viewBox="0 0 375 260" style="position: absolute; left: 0; top: 0; width: 375px; height: 260px; pointer-events: none"><defs><filter id="m8Pool" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"></feGaussianBlur></filter><filter id="m8B" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"></feGaussianBlur></filter></defs><ellipse cx="290" cy="110" rx="150" ry="110" fill="#3A1838" opacity="0.6" filter="url(#m8Pool)"></ellipse><path d="M -10 190 C 100 90, 260 80, 390 140" fill="none" stroke="#F6C2A4" stroke-width="5" opacity="0.5" filter="url(#m8B)"></path><path d="M -10 190 C 100 90, 260 80, 390 140" fill="none" stroke="#FFEBDC" stroke-width="1"></path></svg>
<header style="position: relative; display: flex; justify-content: center; padding: 22px 16px">
<a href="Mobil-01-Landing.dc.html" style="font-family: 'EB Garamond', serif; font-size: 17px; letter-spacing: 0.14em; color: #EADCE2; text-decoration: none">MEZI VÁMI</a>
</header>
<main style="position: relative; padding: 110px 20px 0">
<h1 role="status" style="margin: 0; font-family: 'EB Garamond', serif; font-weight: 400; font-size: 40px; line-height: 1.04; background: linear-gradient(180deg, #F6E6DA 0%, #E5C6B5 100%); -webkit-background-clip: text; background-clip: text; color: transparent">{{ headline }}</h1>
<sc-if value="{{ hasSub }}" hint-placeholder-val="{{ true }}">
<p style="margin: 10px 0 0; font-family: 'EB Garamond', serif; font-size: 22px; color: #F1D0BC">{{ sub }}</p>
</sc-if>
<p style="margin: 14px 0 0; font-size: 15px; line-height: 1.6; color: #E8DAE0">{{ body }}</p>
<sc-if value="{{ hasHelper }}" hint-placeholder-val="{{ true }}">
<p style="margin: 10px 0 0; font-size: 14px; line-height: 1.6; color: #BDA7B2">{{ helper }}</p>
</sc-if>
<dl style="margin: 24px 0 0; padding: 18px; border-radius: 16px; border: 1px solid #3A2535; background: #1E1120; display: flex; flex-direction: column; gap: 14px">
<div><dt style="font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase; color: #C9B0BE">Číslo objednávky</dt><dd style="margin: 4px 0 0; font-size: 17px; color: #F4E9E4">MV-[REF]</dd></div>
<sc-if value="{{ showEmail }}" hint-placeholder-val="{{ true }}"><div><dt style="font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase; color: #C9B0BE">E-mail pro doručení</dt><dd style="margin: 4px 0 0; font-size: 16px; color: #F4E9E4; word-break: break-all">jana.novakova@email.cz</dd></div></sc-if>
<sc-if value="{{ showDue }}" hint-placeholder-val="{{ false }}"><div><dt style="font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase; color: #C9B0BE">Doručíme nejpozději</dt><dd style="margin: 4px 0 0; font-size: 16px; color: #F4E9E4">[TERMÍN DORUČENÍ]</dd></div></sc-if>
</dl>
<sc-if value="{{ isDel }}" hint-placeholder-val="{{ false }}">
<a href="#" style="margin-top: 24px; display: flex; align-items: center; justify-content: center; min-height: 58px; border-radius: 999px; background: linear-gradient(180deg, #F7D5BB 0%, #E8B391 100%); color: #2A1220; text-decoration: none; box-shadow: 0 12px 36px rgba(240, 160, 130, 0.4), inset 0 1px 0 rgba(255, 244, 236, 0.7); font-size: 16px; font-weight: 500">Stáhnout Hloubkovou analýzu</a>
</sc-if>
<sc-if value="{{ showSupport }}" hint-placeholder-val="{{ true }}">
<a href="#" style="margin-top: 12px; display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; border: 1px solid rgba(240, 190, 165, 0.45); color: #F4E9E4; text-decoration: none; font-size: 15px">Kontaktovat podporu</a>
</sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stav":{"editor":"enum","options":["Platba potvrzena","Analýza se připravuje","Analýza připravená","Odkaz vypršel"],"default":"Platba potvrzena"},"podpora":{"editor":"boolean","default":true},"$preview":{"width":375,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const st = this.props.stav ?? 'Platba potvrzena';
const sup = !!(this.props.podpora ?? true);
const S = {
'Platba potvrzena': { h: 'Platba potvrzena', s: 'Objednávku jsme přijali.', b: 'Potvrzení objednávky vám ihned pošleme e-mailem. Hloubkovou analýzu doručíme do 48 hodin od potvrzení platby; odkaz ke stažení přijde v samostatném e-mailu.', hp: 'Při kontaktu s podporou uveďte číslo objednávky.', hpSup: true, sup: true, email: true, due: false, del: false },
'Analýza se připravuje': { h: 'Hloubková analýza se připravuje', s: 'Objednávku jsme přijali.', b: 'Hloubkovou analýzu MEZI VÁMI doručíme nejpozději do 48 hodin od potvrzení platby.', hp: 'Jakmile bude analýza připravená, pošleme vám e-mail s bezpečným odkazem ke stažení.', hpSup: false, sup: false, email: false, due: true, del: false },
'Analýza připravená': { h: 'Vaše Hloubková analýza je připravená', s: 'Stáhněte si ji prostřednictvím zabezpečeného odkazu.', b: 'Odkaz platí 30 dní. O nový odkaz můžete požádat podporu po dobu uchování analýzy.', hp: 'Při žádosti o nový odkaz uveďte číslo objednávky.', hpSup: true, sup: true, email: false, due: false, del: true },
'Odkaz vypršel': { h: 'Platnost odkazu vypršela', s: '', b: 'O nový odkaz můžete požádat podporu. Vystavit jej lze po dobu uchování analýzy.', hp: 'Uveďte číslo objednávky.', hpSup: true, sup: true, email: false, due: false, del: false }
};
const x = S[st] || S['Platba potvrzena'];
return {
headline: x.h, sub: x.s, hasSub: !!x.s, body: x.b,
helper: x.hp, hasHelper: !!x.hp && (!x.hpSup || sup),
showSupport: x.sup && sup, showEmail: x.email, showDue: x.due, isDel: x.del
};
}
}
</script>
</body>
</html>
